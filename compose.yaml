services:
  app:
    build: .
    environment:
      DATABASE_URL: file:/data/tictactoe.db
      APP_ORIGIN: ${APP_ORIGIN:?Run ./scripts/setup.sh first}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Run ./scripts/setup.sh first}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run ./scripts/setup.sh first}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
    volumes:
      - game-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    environment:
      # The private Docker backend must not be routed through an egress proxy.
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},app
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1},app
    ports:
      - 127.0.0.1:${HTTPS_PORT:-8443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  game-data:
  caddy-data:
  caddy-config:
