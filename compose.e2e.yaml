# Only the explicitly isolated test project receives the reset-script guard.
services:
  app:
    environment:
      TICTACTOE_E2E_PROJECT: ${TICTACTOE_E2E_PROJECT:?Set an isolated tictactoe-e2e project}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM_EMAIL: verification@example.test
      SMTP_USER: ""
      SMTP_PASSWORD: ""

  mailpit:
    image: axllent/mailpit:v1.24.2@sha256:3ad9483ac2dea937ae402b95435ab12c3355d2373a1002a49491db0be536d8fa
    ports:
      - 127.0.0.1:${TICTACTOE_E2E_MAIL_PORT:?Set an isolated mailbox port}:8025

# Rehearsal may reuse the already trusted test authority; game data stays separate.
volumes:
  caddy-data:
    name: ${TICTACTOE_E2E_CA_VOLUME:?Set the isolated test certificate volume}
